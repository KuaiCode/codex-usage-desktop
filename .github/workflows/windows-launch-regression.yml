name: Windows launch regression

on:
  push:
    branches: [validation/windows-codex-launch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:web
      - name: Check changed Rust file formatting
        run: rustfmt --check --edition 2021 src-tauri/src/codex_limits.rs
      - name: Run all backend tests including real Windows CLI wrappers
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
